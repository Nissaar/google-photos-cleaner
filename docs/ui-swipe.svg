<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 660" width="360" height="660" role="img" aria-label="Illustration of the swipe review screen">
  <defs>
    <linearGradient id="ph" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A3038"/>
      <stop offset="1" stop-color="#1A1E24"/>
    </linearGradient>
  </defs>
  <style>
    .bg { fill: #0D0F12; }
    .surf { fill: #16191D; }
    .t { fill: #E8EAED; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .dim { fill: #B6BCC6; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .pri { fill: #6EA8FF; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .out { stroke: #39404A; fill: none; }
  </style>

  <rect class="bg" width="360" height="660" rx="14"/>

  <!-- Header -->
  <path class="out" stroke-width="1.8" stroke-linecap="round" d="M24 36l-7 7 7 7M17 43h14"/>
  <text class="t" x="46" y="40" font-size="15" font-weight="600">July 2024</text>
  <text class="dim" x="46" y="55" font-size="10">112 of 340</text>
  <text class="pri" x="336" y="46" font-size="12" text-anchor="end" font-weight="500">Review 8</text>

  <!-- Progress -->
  <rect x="0" y="66" width="360" height="2" fill="#232830"/>
  <rect x="0" y="66" width="118" height="2" fill="#6EA8FF"/>

  <!-- Card behind (next photo peeking through) -->
  <rect x="30" y="96" width="300" height="392" rx="20" fill="#101317" opacity="0.9"/>

  <!-- Card, rotated slightly as if being dragged left -->
  <g transform="rotate(-4 180 300) translate(-26 0)">
    <rect class="surf" x="24" y="90" width="312" height="404" rx="20"/>
    <path d="M24 110a20 20 0 0 1 20-20h272a20 20 0 0 1 20 20v242H24z" fill="url(#ph)"/>

    <!-- placeholder image glyph, deliberately not a real photo -->
    <g opacity="0.5" transform="translate(150,196)">
      <rect x="0" y="0" width="60" height="46" rx="4" class="out" stroke-width="2"/>
      <circle cx="16" cy="14" r="5" fill="#B6BCC6"/>
      <path fill="#B6BCC6" d="M6 40l16-19 11 13 8-8 13 14z"/>
    </g>
    <text class="dim" x="180" y="272" font-size="9" text-anchor="middle" opacity="0.7">
      your photo appears here
    </text>

    <!-- DELETE stamp, fading in with the drag -->
    <g transform="translate(248,116)">
      <rect x="0" y="0" width="72" height="30" rx="8" stroke="#E5484D" stroke-width="3" fill="none"/>
      <text x="36" y="21" font-size="14" font-weight="700" text-anchor="middle"
            fill="#E5484D" font-family="system-ui, sans-serif">DELETE</text>
    </g>

    <!-- Date row -->
    <text class="dim" x="42" y="378" font-size="12">14 Jul 2024 · 18:22</text>
  </g>

  <!-- Action bar -->
  <g transform="translate(0,556)">
    <!-- delete -->
    <circle cx="72" cy="0" r="32" fill="#16191D" stroke="#E5484D" stroke-width="2" opacity="0.95"/>
    <path stroke="#E5484D" stroke-width="3" stroke-linecap="round" d="M62 -10l20 20M82 -10l-20 20"/>
    <!-- undo -->
    <circle cx="180" cy="0" r="24" fill="#16191D" stroke="#39404A" stroke-width="2"/>
    <path class="out" stroke="#B6BCC6" stroke-width="2" stroke-linecap="round"
          d="M172 -2a8 8 0 1 1 8 8"/>
    <path fill="#B6BCC6" d="M172 -8l1 7-6-2z"/>
    <!-- keep -->
    <circle cx="288" cy="0" r="32" fill="#16191D" stroke="#2E9E5B" stroke-width="2"/>
    <path stroke="#2E9E5B" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"
          fill="none" d="M277 0l8 8 14-16"/>
  </g>

  <text class="dim" x="180" y="628" font-size="10" text-anchor="middle" opacity="0.75">
    Swipe left to delete, right to keep — or use the buttons
  </text>
</svg>
