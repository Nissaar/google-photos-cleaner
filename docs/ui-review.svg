<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 660" width="360" height="660" role="img" aria-label="Illustration of the review and commit screen">
  <defs>
    <linearGradient id="thumb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A3038"/>
      <stop offset="1" stop-color="#1A1E24"/>
    </linearGradient>
  </defs>
  <style>
    .bg { fill: #0D0F12; }
    .surf { fill: #16191D; }
    .t { fill: #E8EAED; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .dim { fill: #B6BCC6; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .pri { fill: #6EA8FF; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .out { stroke: #39404A; fill: none; }
  </style>

  <rect class="bg" width="360" height="660" rx="14"/>

  <!-- Header -->
  <path class="out" stroke-width="1.8" stroke-linecap="round" d="M24 36l-7 7 7 7M17 43h14"/>
  <text class="t" x="46" y="40" font-size="16" font-weight="600">Marked for deletion</text>
  <text class="dim" x="46" y="57" font-size="11">37 photos · nothing sent to Google yet</text>
  <text class="pri" x="338" y="44" font-size="12" text-anchor="end" font-weight="500">History</text>

  <!-- Thumbnail grid, each removable -->
  <g>
    <!-- row 1 -->
    <g transform="translate(14,78)">
      <rect width="104" height="104" rx="10" fill="url(#thumb)"/>
      <circle cx="90" cy="14" r="12" fill="#16191D" opacity="0.9"/>
      <path stroke="#E8EAED" stroke-width="2" stroke-linecap="round" d="M85 9l10 10M95 9l-10 10"/>
    </g>
    <g transform="translate(128,78)">
      <rect width="104" height="104" rx="10" fill="url(#thumb)"/>
      <circle cx="90" cy="14" r="12" fill="#16191D" opacity="0.9"/>
      <path stroke="#E8EAED" stroke-width="2" stroke-linecap="round" d="M85 9l10 10M95 9l-10 10"/>
    </g>
    <g transform="translate(242,78)">
      <rect width="104" height="104" rx="10" fill="url(#thumb)"/>
      <circle cx="90" cy="14" r="12" fill="#16191D" opacity="0.9"/>
      <path stroke="#E8EAED" stroke-width="2" stroke-linecap="round" d="M85 9l10 10M95 9l-10 10"/>
    </g>
    <!-- row 2 -->
    <g transform="translate(14,190)">
      <rect width="104" height="104" rx="10" fill="url(#thumb)"/>
      <circle cx="90" cy="14" r="12" fill="#16191D" opacity="0.9"/>
      <path stroke="#E8EAED" stroke-width="2" stroke-linecap="round" d="M85 9l10 10M95 9l-10 10"/>
    </g>
    <g transform="translate(128,190)">
      <rect width="104" height="104" rx="10" fill="url(#thumb)"/>
      <circle cx="90" cy="14" r="12" fill="#16191D" opacity="0.9"/>
      <path stroke="#E8EAED" stroke-width="2" stroke-linecap="round" d="M85 9l10 10M95 9l-10 10"/>
    </g>
    <g transform="translate(242,190)">
      <rect width="104" height="104" rx="10" fill="url(#thumb)"/>
      <circle cx="90" cy="14" r="12" fill="#16191D" opacity="0.9"/>
      <path stroke="#E8EAED" stroke-width="2" stroke-linecap="round" d="M85 9l10 10M95 9l-10 10"/>
    </g>
    <!-- row 3 -->
    <g transform="translate(14,302)">
      <rect width="104" height="104" rx="10" fill="url(#thumb)"/>
    </g>
    <g transform="translate(128,302)">
      <rect width="104" height="104" rx="10" fill="url(#thumb)"/>
    </g>
    <g transform="translate(242,302)">
      <rect width="104" height="104" rx="10" fill="url(#thumb)"/>
    </g>
  </g>

  <text class="dim" x="180" y="436" font-size="10" text-anchor="middle" opacity="0.7">
    tap × on any photo to keep it after all
  </text>

  <!-- Commit bar -->
  <path class="surf" d="M0 470h360v176a14 14 0 0 1-14 14H14a14 14 0 0 1-14-14z"/>
  <text class="dim" x="20" y="500" font-size="11.5">These will be moved to the Google Photos trash,</text>
  <text class="dim" x="20" y="517" font-size="11.5">where they stay recoverable for 60 days.</text>

  <rect x="20" y="536" width="320" height="46" rx="23" fill="#E5484D"/>
  <text x="180" y="564" font-size="14" font-weight="600" text-anchor="middle" fill="#FFFFFF"
        font-family="system-ui, -apple-system, sans-serif">Delete 37 from Google Photos</text>

  <text class="dim" x="180" y="608" font-size="10" text-anchor="middle" opacity="0.75">
    Nothing leaves this phone until you confirm here
  </text>
</svg>
