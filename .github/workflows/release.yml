name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v1.0.0)'
        required: true

# Nothing by default; the release job asks for exactly what publishing needs.
permissions: {}

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # Hoisted to job level on purpose: the `secrets` context is not available in a
    # step-level `if`, but `env` is. This is what makes optional signing work.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      # The tag arrives through env, never pasted into the script: a ${{ }} expression
      # inside `run` is substituted before the shell parses it, so a crafted input
      # would run as a command. It is also checked, since it names files below.
      - name: Resolve version
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Not a release tag: $TAG"
            exit 1
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"

      # On workflow_dispatch github.ref_name is the branch, so check out the tag
      # explicitly rather than whatever main happens to be.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          # On by default in v4; stated so a future bump cannot quietly drop it.
          # A tampered gradle-wrapper.jar would run with the signing secrets in reach.
          validate-wrappers: true

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      # Stamps versionName/versionCode from the tag, so the APK identifies itself
      # as exactly the version being released.
      - name: Assemble release APK
        env:
          RELEASE_TAG: ${{ steps.version.outputs.name }}
        run: ./gradlew assembleRelease --no-daemon

      # Signing is optional so the workflow still works in a fork with no secrets:
      # without a keystore it publishes an unsigned APK and labels it as such.
      - name: Decode keystore
        id: keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Sign APK
        if: steps.keystore.outputs.present == 'true'
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -r | head -1)
          [ -n "$APKSIGNER" ] || { echo "::error::apksigner not found"; exit 1; }

          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "photo-cleaner-${VERSION}.apk" \
            app/build/outputs/apk/release/app-release-unsigned.apk

          "$APKSIGNER" verify --verbose "photo-cleaner-${VERSION}.apk"

      - name: Stage unsigned APK
        if: steps.keystore.outputs.present != 'true'
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk \
             "photo-cleaner-${VERSION}-unsigned.apk"

      - name: Checksums
        run: sha256sum photo-cleaner-*.apk | tee SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          # Required for workflow_dispatch, where the run is not tag-triggered.
          tag_name: ${{ steps.version.outputs.name }}
          files: |
            photo-cleaner-*.apk
            SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## Install

            Download the APK below and open it on your phone. Android will ask you to
            allow installs from this source, and Play Protect will warn that it has not
            seen this developer before — both are expected for a sideloaded app.

            Verify the download against `SHA256SUMS.txt` before installing.

            ## Before you delete anything

            Run a [Google Takeout](https://takeout.google.com) export first. Trashed
            photos are recoverable for 60 days, but an export is the real safety net.

            This app uses Google's private web API, which is against the Google Photos
            terms of service. See the README for what that does and does not mean.
