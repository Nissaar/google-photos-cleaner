name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch rather than queueing them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      # The parser turns Google's positional arrays into the keys deletion acts on,
      # so its report is the one worth keeping even when a later step fails.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

      - name: Android Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 14

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      # Release runs R8, which catches missing keep rules that debug never exercises
      # (a missing -dontwarn for Tink already broke one build). Do it on every change
      # so it cannot surface for the first time at a release tag.
      - name: Assemble release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon

      # The app's main privacy claim is that it asks for almost nothing. Assert that,
      # so a dependency cannot quietly introduce a permission in a future release.
      - name: Assert the permission set has not grown
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -r | head -1)

          PERMS=$("$AAPT" dump permissions "$APK" \
            | grep "uses-permission" \
            | grep -oP "(?<=name=')[^']+" \
            | sort -u)

          EXPECTED=$(printf '%s\n' \
            'android.permission.INTERNET' \
            'android.permission.USE_BIOMETRIC' \
            'android.permission.USE_FINGERPRINT' \
            'xyz.photocleaner.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION' \
            | sort -u)

          echo "Declared:"; echo "$PERMS"

          if [ "$PERMS" != "$EXPECTED" ]; then
            echo "::error::Permission set changed."
            diff <(echo "$EXPECTED") <(echo "$PERMS") || true
            exit 1
          fi
          echo "Permission set unchanged."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
