name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch rather than queueing them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Build and test only read the repository. Without this, the token gets whatever
# the repository default is, which may include write access.
permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          # On by default in v4; stated so a future bump cannot quietly drop it.
          # A tampered gradle-wrapper.jar would run with the signing secrets in reach.
          validate-wrappers: true

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      # The parser turns Google's positional arrays into the keys deletion acts on,
      # so its report is the one worth keeping even when a later step fails.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

      - name: Android Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 14

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      # Release runs R8, which catches missing keep rules that debug never exercises
      # (a missing -dontwarn for Tink already broke one build). Do it on every change
      # so it cannot surface for the first time at a release tag.
      - name: Assemble release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon

      # The app's main privacy claim is that it asks for almost nothing. Assert that,
      # so a dependency cannot quietly introduce a permission in a future release.
      - name: Assert the permission set has not grown
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          [ -f "$APK" ] || { echo "::error::APK not found at $APK"; exit 1; }

          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -r | head -1)
          [ -n "$AAPT" ] || { echo "::error::aapt2 not found under $ANDROID_HOME"; exit 1; }

          # grep exits 1 on no match, which pipefail would turn into an opaque failure.
          # An empty permission list is a real result, so handle it explicitly below.
          PERMS=$("$AAPT" dump permissions "$APK" \
            | { grep "uses-permission" || true; } \
            | { grep -oP "(?<=name=')[^']+" || true; } \
            | sort -u)

          EXPECTED=$(printf '%s\n' \
            'android.permission.INTERNET' \
            'android.permission.USE_BIOMETRIC' \
            'android.permission.USE_FINGERPRINT' \
            'xyz.photocleaner.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION' \
            | sort -u)

          echo "Declared:"; echo "$PERMS"

          if [ "$PERMS" != "$EXPECTED" ]; then
            echo "::error::Permission set changed."
            diff <(echo "$EXPECTED") <(echo "$PERMS") || true
            exit 1
          fi
          echo "Permission set unchanged."

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
